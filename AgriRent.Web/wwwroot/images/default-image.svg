<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f0f7ee" rx="12"/>
  
  <!-- Subtle border -->
  <rect width="400" height="300" fill="none" stroke="#c8e6c0" stroke-width="2" rx="12"/>

  <!-- Tractor body -->
  <rect x="130" y="148" width="110" height="55" rx="6" fill="#4caf50" opacity="0.85"/>

  <!-- Cab / roof -->
  <rect x="180" y="122" width="60" height="30" rx="5" fill="#388e3c"/>
  <rect x="190" y="128" width="40" height="18" rx="3" fill="#b2dfdb" opacity="0.7"/>

  <!-- Exhaust pipe -->
  <rect x="178" y="108" width="7" height="18" rx="3" fill="#555"/>
  <ellipse cx="181.5" cy="107" rx="5" ry="3" fill="#777"/>

  <!-- Hood -->
  <rect x="130" y="150" width="55" height="36" rx="4" fill="#2e7d32"/>

  <!-- Large rear wheel -->
  <circle cx="175" cy="210" r="38" fill="#333" opacity="0.9"/>
  <circle cx="175" cy="210" r="28" fill="#555"/>
  <circle cx="175" cy="210" r="10" fill="#888"/>
  <!-- Wheel spokes -->
  <line x1="175" y1="182" x2="175" y2="238" stroke="#777" stroke-width="4"/>
  <line x1="147" y1="210" x2="203" y2="210" stroke="#777" stroke-width="4"/>
  <line x1="155" y1="190" x2="195" y2="230" stroke="#777" stroke-width="3"/>
  <line x1="195" y1="190" x2="155" y2="230" stroke="#777" stroke-width="3"/>

  <!-- Small front wheel -->
  <circle cx="232" cy="210" r="22" fill="#333" opacity="0.9"/>
  <circle cx="232" cy="210" r="14" fill="#555"/>
  <circle cx="232" cy="210" r="6" fill="#888"/>

  <!-- Ground line -->
  <line x1="90" y1="235" x2="310" y2="235" stroke="#a5d6a7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Icon label -->
  <text x="200" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#558b2f" text-anchor="middle" font-weight="600" letter-spacing="0.5">No Image Available</text>
</svg>
